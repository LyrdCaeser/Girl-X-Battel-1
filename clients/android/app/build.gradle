plugins {
    id "com.android.application"
}

android {
    namespace "com.gxb3.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.gxb3.game"
        minSdk 26
        targetSdk 35
        versionCode 100004
        versionName "1.0.0-rc4"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // RC distribution signature. Replace with the permanent private
            // release keystore before the first irreversible public Android release.
            signingConfig signingConfigs.debug
        }
    }
}
