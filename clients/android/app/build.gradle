plugins {
    id "com.android.application"
}
def offlineManifestUrl = (project.findProperty("gxbOfflineManifestUrl") ?: "").toString()
def offlineTrustedHosts = (project.findProperty("gxbOfflineTrustedHosts") ?: "").toString()
def offlineManifestPublicKey = (project.findProperty("gxbOfflineManifestPublicKeyB64") ?: "").toString()
def releaseKeystore = (project.findProperty("gxbReleaseKeystore") ?: System.getenv("GXB_RELEASE_KEYSTORE") ?: "").toString()
def releaseStorePassword = (project.findProperty("gxbReleaseStorePassword") ?: System.getenv("GXB_RELEASE_STORE_PASSWORD") ?: "").toString()
def releaseKeyAlias = (project.findProperty("gxbReleaseKeyAlias") ?: System.getenv("GXB_RELEASE_KEY_ALIAS") ?: "").toString()
def releaseKeyPassword = (project.findProperty("gxbReleaseKeyPassword") ?: System.getenv("GXB_RELEASE_KEY_PASSWORD") ?: "").toString()
def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r') + '"'
}

android {
    namespace "com.quangho.goddess.battle"
    compileSdk 35
    sourceSets {
        main {
            // battle_host.lua and runtime/lua are read from app-private storage
            // by BattleRuntimeBridge after extraction from the APK assets.
            assets.srcDirs += file("../../../runtime")
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            create("offlineRelease") {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.quangho.goddess.offlinebattle"
        minSdk 26
        targetSdk 35
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionCode 100009
        versionName "1.0.2-alpha-rc8"
        buildConfigField "String", "OFFLINE_RESOURCE_MANIFEST_URL", asBuildConfigString(offlineManifestUrl)
        buildConfigField "String", "OFFLINE_RESOURCE_TRUSTED_HOSTS", asBuildConfigString(offlineTrustedHosts)
        buildConfigField "String", "OFFLINE_RESOURCE_PUBLIC_KEY_B64", asBuildConfigString(offlineManifestPublicKey)
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.offlineRelease
            } else {
                // Local developer builds remain possible; release CI runs the gate,
                // which rejects this debug fallback before publishing.
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "org.bouncycastle:bcprov-jdk18on:1.80"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
