plugins {
    id "com.android.application"
}

android {
    namespace "com.quangho.goddess.battle"
    compileSdk 35

    defaultConfig {
        applicationId "com.quangho.goddess.battle"
        minSdk 26
        targetSdk 35
        versionCode 100009
        versionName "1.0.2-alpha-rc8"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // RC distribution signature. Replace with the permanent private
            // release keystore before the first irreversible public Android release.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
