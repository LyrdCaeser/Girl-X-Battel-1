name: Android offline release gate
on:
  pull_request:
    branches: [feature/offline-mode]
    paths:
      - "clients/android/**"
      - "tools/verify_android_release_gate.py"
      - ".github/workflows/android-offline-release-gate.yml"
  push:
    branches: [feature/offline-mode]
    paths:
      - "clients/android/**"
      - "tools/verify_android_release_gate.py"
      - ".github/workflows/android-offline-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    if: github.ref == 'refs/heads/feature/offline-mode' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      OFFLINE_PUBLIC_KEY_B64: ${{ secrets.OFFLINE_MANIFEST_PUBLIC_KEY_B64 }}
      OFFLINE_SIGNING_KEY_PEM: ${{ secrets.OFFLINE_MANIFEST_SIGNING_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Check release secrets and create isolated signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_B64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD OFFLINE_PUBLIC_KEY_B64 OFFLINE_SIGNING_KEY_PEM; do
            test -n "${!name:-}" || { echo "Missing required release secret: $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          cat > "$RUNNER_TEMP/build_signed_manifest.py" <<'PY'
          import base64, json, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          payload = json.dumps({"manifest_version": 1, "resource_version": "gate", "packs": []}, separators=(",", ":")).encode()
          key = serialization.load_pem_private_key(os.environ["OFFLINE_SIGNING_KEY_PEM"].encode(), password=None)
          envelope = {"payload_b64": base64.b64encode(payload).decode(), "signature_b64": base64.b64encode(key.sign(payload)).decode()}
          open(os.environ["MANIFEST_OUT"], "w").write(json.dumps(envelope))
          PY
          python -m pip install --disable-pip-version-check "cryptography>=41,<47"
          MANIFEST_OUT="$RUNNER_TEMP/signed-manifest.json" OFFLINE_SIGNING_KEY_PEM="$OFFLINE_SIGNING_KEY_PEM" python "$RUNNER_TEMP/build_signed_manifest.py"
      - name: Build release APK with supplied private keystore
        run: |
          ./clients/android/gradlew -p clients/android :app:assembleRelease --no-daemon
        env:
          GXB_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          GXB_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          GXB_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GXB_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      - name: Verify keystore, APK certificate, public key and manifest signature
        run: |
          python tools/verify_android_release_gate.py \
            --keystore "$RUNNER_TEMP/release.keystore" \
            --store-password "$ANDROID_STORE_PASSWORD" \
            --alias "$ANDROID_KEY_ALIAS" \
            --public-key-b64 "$OFFLINE_PUBLIC_KEY_B64" \
            --manifest "$RUNNER_TEMP/signed-manifest.json" \
            --apk clients/android/app/build/outputs/apk/release/app-release.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Upload verified production-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GXB3-offline-release-${{ github.sha }}
          path: clients/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
