name: Publish offline resources (feature/offline-mode)

on:
  push:
    branches:
      - feature/offline-mode
    paths:
      - 'web/**'
      - 'tools/build_offline_resource_manifest.py'
      - 'tools/publish_offline_resource_s3.sh'
      - 'tools/offline_resources_allowlist.json'
      - '.github/workflows/publish-offline-resources.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: offline-resource-publish-feature-offline-mode
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/feature/offline-mode'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      RESOURCE_PREFIX: offline-resources
      RESOURCE_VERSION: web-${{ github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Enforce branch and required release configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          RESOURCE_BUCKET: ${{ secrets.RESOURCE_BUCKET }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
          OFFLINE_MANIFEST_SIGNING_KEY: ${{ secrets.OFFLINE_MANIFEST_SIGNING_KEY || secrets.OFFLINE_MANIFEST_PRIVATE_KEY || secrets.OFFLINE_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/offline-mode' || {
            echo 'Refusing to publish from any ref except feature/offline-mode.' >&2
            exit 1
          }
          for name in AWS_ROLE_ARN RESOURCE_BUCKET CLOUDFRONT_DOMAIN DISTRIBUTION_ID OFFLINE_MANIFEST_SIGNING_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: $name"
              exit 1
            fi
          done

      - name: Install Git LFS and hydrate web resources
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='web/**' --exclude=''

      - name: Verify all audio payloads are hydrated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import subprocess

          extensions = {'.mp3', '.ogg', '.wav', '.m4a', '.aac', '.flac'}
          paths = subprocess.check_output(
              ['git', 'lfs', 'ls-files', '--name-only'], text=True
          ).splitlines()
          audio = [p for p in paths if p.startswith('web/assets/') and PurePosixPath(p).suffix.lower() in extensions]
          missing = []
          pointers = []
          for raw in audio:
              path = Path(raw)
              if not path.is_file():
                  missing.append(raw)
                  continue
              with path.open('rb') as stream:
                  if stream.read(44).startswith(b'version https://git-lfs.github.com/spec/v1'):
                      pointers.append(raw)
          voices = [p for p in audio if p.startswith('web/assets/voices/')]
          if len(voices) != 6108:
              raise SystemExit(f'Expected 6108 voice assets, found {len(voices)}')
          if missing or pointers:
              raise SystemExit(f'Audio hydration incomplete: {len(missing)} missing, {len(pointers)} pointers')
          print(f'Verified {len(audio)} audio payloads; all {len(voices)} voice files are present and hydrated.')
          PY

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubOfflineResourcePublish

      - name: Build signed immutable resource packs
        shell: bash
        env:
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          OFFLINE_MANIFEST_SIGNING_KEY: ${{ secrets.OFFLINE_MANIFEST_SIGNING_KEY || secrets.OFFLINE_MANIFEST_PRIVATE_KEY || secrets.OFFLINE_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/offline-manifest-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          if [[ "$OFFLINE_MANIFEST_SIGNING_KEY" == *'BEGIN PRIVATE KEY'* ]]; then
            printf '%s\n' "$OFFLINE_MANIFEST_SIGNING_KEY" > "$key_file"
          else
            printf '%s' "$OFFLINE_MANIFEST_SIGNING_KEY" | base64 --decode > "$key_file"
          fi
          VERSION_DIR="$RUNNER_TEMP/offline-resource-release/$RESOURCE_VERSION"
          echo "VERSION_DIR=$VERSION_DIR" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check 'cryptography>=41'
          python3 tools/build_offline_resource_manifest.py \
            --source-root . \
            --allowlist tools/offline_resources_allowlist.json \
            --output-dir "$VERSION_DIR" \
            --resource-version "$RESOURCE_VERSION" \
            --base-url "https://$CLOUDFRONT_DOMAIN/$RESOURCE_PREFIX" \
            --max-pack-size "$((100 * 1024 * 1024))" \
            --private-key "$key_file"

      - name: Publish versioned packs and stable manifest
        shell: bash
        env:
          AWS_REGION: ap-southeast-1
          RESOURCE_BUCKET: ${{ secrets.RESOURCE_BUCKET }}
          RESOURCE_PREFIX: offline-resources
          RESOURCE_VERSION: web-${{ github.sha }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "${VERSION_DIR:-}"
          tools/publish_offline_resource_s3.sh
