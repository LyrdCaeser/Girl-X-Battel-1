name: GXB3 - Dich thoai tieng Viet

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "So dong dich moi (0 = tat ca; co the chay lai de dich tiep)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1000"
          - "2500"

permissions:
  contents: write

concurrency:
  group: gxb3-vietnamese-snez
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out GXB3 Vietnamese branch
        uses: actions/checkout@v4
        with:
          ref: snez-vietnamese
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.44.2 sentencepiece==0.2.0
      - name: Check corpus before translating
        run: python tools/translate_vi_dialogue.py
      - name: Translate original narrative content (offline model)
        run: python tools/translate_vi_dialogue.py --apply --batch-size 12 --limit "\${{ inputs.max_items }}"
      - name: Review untranslated candidates
        run: |
          python tools/translate_vi_dialogue.py --verify || echo "Translation candidates remain: see report, rerun or edit manually."
      - name: Validate and commit changes to Vietnamese branch
        run: |
          python -m json.tool data/story.json > /dev/null
          python -m json.tool data/partner_plot.json > /dev/null
          python -m json.tool web/assets/girl-details.json > /dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story.json data/partner_plot.json web/assets/girl-details.json
          if ! git diff --staged --quiet; then
            git commit -m "i18n(gxb3): bulk Vietnamese original dialogue, plot and character quotes"
            git push origin HEAD:snez-vietnamese
          else
            echo "No translation changes were necessary."
          fi
