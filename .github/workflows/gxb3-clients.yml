name: GXB 3 ALPHA RC7 client packages

on:
  workflow_dispatch:
  push:
    branches: [snez-vietnamese]
    paths:
      - "clients/**"
      - ".gitattributes"
      - ".github/workflows/gxb3-clients.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows EXE ALPHA RC7
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check production URL (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $r = Invoke-WebRequest -UseBasicParsing -Uri "https://180-93-111-99.sslip.io/readyz" -TimeoutSec 30
          if ($r.StatusCode -ne 200) { throw "Production temporarily unavailable" }
      - name: Install Windows packager and icon converter
        run: python -m pip install -r clients/windows/requirements-build.txt Pillow
      - name: Generate branded Windows icon
        run: |
          python clients/tools/generate_icons.py
          python -c "from PIL import Image; im=Image.open('clients/icons/gxb3-icon.jpg'); im.verify(); print('Verified game cover launcher source')"
          python -c "from pathlib import Path; assert Path('clients/windows/gxb3.ico').stat().st_size > 1000"
      - name: Build Windows x64 EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NuThanChienDau-GXB3-ALPHA-RC7 --icon clients/windows/gxb3.ico --collect-all webview clients/windows/gxb3_launcher.py
      - name: Verify native Windows EXE
        shell: pwsh
        run: |
          $target = "dist/NuThanChienDau-GXB3-ALPHA-RC7.exe"
          if (!(Test-Path $target)) { throw "EXE was not built" }
          if ((Get-Item $target).Length -lt 1000000) { throw "EXE unexpectedly small" }
          Get-Item $target | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: NuThanChienDau-GXB3-Windows-ALPHA-RC7
          path: dist/NuThanChienDau-GXB3-ALPHA-RC7.exe
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  android-apk:
    name: Android APK ALPHA RC7
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Check production URL (informational)
        continue-on-error: true
        run: curl --fail --retry 2 --retry-delay 3 --max-time 30 https://180-93-111-99.sslip.io/readyz
      - name: Generate branded Android icon
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 clients/tools/generate_icons.py
      - name: Build signed ALPHA RC7 APK
        run: gradle -p clients/android :app:assembleRelease --stacktrace --no-daemon
      - name: Verify package signature and size
        shell: bash
        run: |
          set -e
          src="clients/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$src"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$src"
          cp "$src" NuThanChienDau-GXB3-Android-ALPHA-RC7.apk
          ls -lh NuThanChienDau-GXB3-Android-ALPHA-RC7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NuThanChienDau-GXB3-Android-ALPHA-RC7
          path: NuThanChienDau-GXB3-Android-ALPHA-RC7.apk
          if-no-files-found: error
          retention-days: 30

  ios-beta:
    name: iOS ALPHA RC7 developer IPA and Web Clip
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check iPhoneOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Generate branded iOS icons
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 clients/tools/generate_icons.py
      - name: Compile genuine iOS arm64 WKWebView application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload/GXB3.app
          cp clients/ios/Info.plist build/Payload/GXB3.app/Info.plist
          cp clients/ios/AppIcon/*.png build/Payload/GXB3.app/
          xcrun swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -o build/Payload/GXB3.app/GXB3 \
            clients/ios/GXB3App.swift
          test -s build/Payload/GXB3.app/GXB3
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Payload/GXB3.app/Info.plist
      - name: Bundle unsigned iOS IPA for later Apple signing
        shell: bash
        run: |
          cd build
          zip -qry ../NuThanChienDau-GXB3-iOS-ALPHA-RC7-UNSIGNED.ipa Payload
          cd ..
          test -s NuThanChienDau-GXB3-iOS-ALPHA-RC7-UNSIGNED.ipa
          unzip -t NuThanChienDau-GXB3-iOS-ALPHA-RC7-UNSIGNED.ipa | tail -1
      - name: Create installable Safari Web Clip alternative
        run: python3 clients/ios/make_webclip.py
      - uses: actions/upload-artifact@v4
        with:
          name: NuThanChienDau-GXB3-iOS-ALPHA-RC7
          path: |
            NuThanChienDau-GXB3-iOS-ALPHA-RC7-UNSIGNED.ipa
            NuThanChienDau-GXB3-iOS-ALPHA-RC7.mobileconfig
          if-no-files-found: error
          retention-days: 30
