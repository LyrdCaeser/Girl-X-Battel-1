name: Generate Vietnamese Station Descriptions

on:
  push:
    branches: [snez-vietnamese]
    paths:
      - tools/translate_station_vi.py
      - .github/workflows/translate-station-vi.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gxb3-station-vi
  cancel-in-progress: false

jobs:
  station-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snez-vietnamese
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU translation model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.44.2" "sentencepiece>=0.2,<0.3" "sacremoses>=0.1,<0.2"
      - name: Generate 105 profiles and 417 skill descriptions
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          if test -s web/assets/station/station-vi.json; then
            echo "Translation overlay exists: repair numeric fidelity without downloading the model"
            python tools/translate_station_vi.py --repair
          else
            python tools/translate_station_vi.py --apply --batch-size 12
          fi
          python tools/translate_station_vi.py --verify
      - name: Upload output for review and manual recovery
        uses: actions/upload-artifact@v4
        with:
          name: station-vietnamese-522
          path: web/assets/station/station-vi.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated translations if allowed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/station/station-vi.json
          if ! git diff --cached --quiet; then
            git commit -m "i18n(station): generate Vietnamese for all 105 profiles and 417 skill descriptions"
            git pull --rebase origin snez-vietnamese
            git push origin HEAD:snez-vietnamese
          else
            echo "Translations already up to date"
          fi
